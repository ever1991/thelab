<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Lab — Próximamente</title>
<meta name="description" content="The Lab, coworking para developers en San Luis Potosí. Estamos preparando nuestro nuevo espacio. Muy pronto."/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%23080D08'/%3E%3Crect%20x='1.5'%20y='1.5'%20width='29'%20height='29'%20rx='6'%20fill='%230C150C'%20stroke='%2315803D'/%3E%3Ctext%20x='16'%20y='21.5'%20font-family='monospace'%20font-size='13'%20font-weight='bold'%20fill='%234ADE80'%20text-anchor='middle'%3ETL%3C/text%3E%3C/svg%3E"/>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--g:#4ADE80;--gd:#15803D;--bg:#080D08;--bg2:#0C150C;--bg3:#0D2B0D;--muted:#166534;--w:#FFFFFF;}
html,body{height:100%;}
body{background:var(--bg);color:var(--w);font-family:'DM Sans',sans-serif;display:flex;flex-direction:column;min-height:100vh;position:relative;overflow-x:hidden;}
.grid{position:fixed;inset:0;background-image:linear-gradient(var(--bg3) 1px,transparent 1px),linear-gradient(90deg,var(--bg3) 1px,transparent 1px);background-size:48px 48px;opacity:.25;pointer-events:none;}
.glow{position:fixed;top:15%;left:50%;width:600px;height:600px;transform:translateX(-50%);background:radial-gradient(circle,rgba(74,222,128,.07) 0%,transparent 70%);pointer-events:none;animation:pulse 6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
header{position:relative;padding:1.5rem 2.5rem;display:flex;align-items:center;gap:12px;}
.icon{width:44px;height:44px;background:var(--bg2);border:1px solid var(--bg3);border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'Courier Prime',monospace;font-size:17px;font-weight:700;color:var(--g);}
.brand{font-family:'Courier Prime',monospace;font-size:23px;font-weight:700;}
.brand em{color:var(--g);font-style:normal;}
main{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1.5rem 4rem;}
.box{max-width:720px;text-align:center;}
.tag{font-family:'Courier Prime',monospace;font-size:12px;color:var(--g);letter-spacing:4px;margin-bottom:1.75rem;display:inline-flex;align-items:center;gap:10px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--g);animation:blink 1.4s ease-in-out infinite;}
@keyframes blink{50%{opacity:.25}}
h1{font-family:'Courier Prime',monospace;font-size:clamp(46px,9vw,96px);font-weight:700;line-height:.95;letter-spacing:-3px;margin-bottom:1.75rem;}
h1 .g{color:var(--g);}
h1 .cur{display:inline-block;width:.5em;height:.85em;background:var(--g);margin-left:.08em;vertical-align:-.05em;animation:blink 1s step-end infinite;}
p{font-size:clamp(17px,2.4vw,21px);color:#7CA07C;line-height:1.75;font-weight:300;max-width:560px;margin:0 auto 2.5rem;}
p strong{color:var(--g);font-weight:500;}
.btn{font-family:'Courier Prime',monospace;font-size:14px;padding:14px 28px;background:var(--g);color:#080D08;border-radius:6px;text-decoration:none;font-weight:700;letter-spacing:1px;display:inline-flex;align-items:center;gap:10px;transition:transform .2s,box-shadow .2s;}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(74,222,128,.25);}
footer{position:relative;padding:1.5rem 2.5rem;font-family:'Courier Prime',monospace;font-size:12px;color:var(--muted);letter-spacing:1px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
footer a{color:var(--muted);text-decoration:none;}
footer a:hover{color:var(--g);}
@media (max-width:600px){header,footer{padding:1.25rem 16px;}footer{justify-content:center;text-align:center;}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
</head>
<body>
<div class="grid"></div><div class="glow"></div>
<header>
  <div class="icon">TL</div>
  <div class="brand">THE <em>LAB</em></div>
</header>
<main>
  <div class="box">
    <div class="tag"><span class="dot"></span>EN CONSTRUCCIÓN</div>
    <h1>Muy <span class="g">pronto</span><span class="cur"></span></h1>
    <p>Estamos preparando el <strong>nuevo espacio</strong> de The Lab, el coworking para developers en San Luis Potosí. Si quieres enterarte primero cuando abramos, escríbenos.</p>
    <a class="btn" href="https://wa.me/524448491367?text=Hola%2C%20quiero%20que%20me%20avisen%20cuando%20abra%20The%20Lab" target="_blank" rel="noopener">AVÍSAME POR WHATSAPP →</a>
  </div>
</main>
<footer>
  <span>© 2026 THE LAB · SAN LUIS POTOSÍ</span>
  <a href="https://wa.me/524448491367" target="_blank" rel="noopener">WHATSAPP 444 849 1367</a>
</footer>
</body>
</html>
